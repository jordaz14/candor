services:
  db:
    image: pgvector/pgvector:pg16
    container_name: candor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: company_intel
    ports:
      - "5432:5432"
    volumes:
      - candor_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  candor_pgdata:
