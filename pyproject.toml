[project]
name = "candor"
version = "0.1.0"
description = "MCP server for deep multi-source analysis of S&P 500 companies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "edgartools>=3.0",
    "yfinance>=0.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
candor-ingest = "pipeline.ingest:main"
candor-mcp = "mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp", "pipeline", "skills"]
